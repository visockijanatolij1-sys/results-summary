<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results summary</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="card">
                <div class="card-left">
                    <h2 class="left-card__sub-title">Your Result</h2>
                    <div class="left-card__squre">
                        <p class="final-score">76</p>
                        <p class="score-from">of 100</p>
                    </div>
                    <h1 class="left-card__title">Great</h1>
                    <p class="left-card__text">You scored higher than 65% of the people who have taken these tests.</p>
                </div>
                <div class="card-right">
                    <h2 class="right-card__title">Summary</h2>
                    <div class="right-card__results">
                        <div class="right-card__result result-card__text-one">
                            <p class="result-card__text">Reaction</p>
                            <p class="result-card__score"><span>80 </span>/ 100</p>
                        </div>
                        <div class="right-card__result result-card__text-two">
                            <p class="result-card__text ">Memory</p>
                            <p class="result-card__score"><span>92 </span>/ 100</p>
                        </div>
                        <div class="right-card__result result-card__text-three">
                            <p class="result-card__text">Verbal</p>
                            <p class="result-card__score"><span>61 </span>/ 100</p>
                        </div> 
                        <div class="right-card__result result-card__text-four">
                            <p class="result-card__text">Visual</p>
                            <p class="result-card__score"><span>73 </span>/ 100</p>
                        </div>
                    </div>
                    <button class="button">Continue</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
